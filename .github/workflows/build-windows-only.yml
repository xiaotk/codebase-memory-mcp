# Quick Windows-only build - no tests, no checks, just binaries
name: Quick Windows Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. v0.0.1-test)'
        required: true
        type: string
      with_ui:
        description: 'Build UI variant'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: CLANG64
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-zlib
            make
            zip

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Build standard binary
        shell: msys2 {0}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          scripts/build.sh --version "$VERSION" CC=clang CXX=clang++

      - name: Archive standard binary
        shell: msys2 {0}
        run: |
          BIN=build/c/codebase-memory-mcp
          [ -f "${BIN}.exe" ] && BIN="${BIN}.exe"
          cp "$BIN" codebase-memory-mcp.exe
          scripts/gen-third-party-notices.sh THIRD_PARTY_NOTICES.md
          zip codebase-memory-mcp-windows-amd64.zip codebase-memory-mcp.exe LICENSE install.ps1 THIRD_PARTY_NOTICES.md

      - name: Build UI binary
        if: ${{ inputs.with_ui }}
        shell: msys2 {0}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          scripts/build.sh --with-ui --version "$VERSION" CC=clang CXX=clang++

      - name: Archive UI binary
        if: ${{ inputs.with_ui }}
        shell: msys2 {0}
        run: |
          BIN=build/c/codebase-memory-mcp
          [ -f "${BIN}.exe" ] && BIN="${BIN}.exe"
          cp "$BIN" codebase-memory-mcp.exe
          scripts/gen-third-party-notices.sh THIRD_PARTY_NOTICES.md
          zip codebase-memory-mcp-ui-windows-amd64.zip codebase-memory-mcp.exe LICENSE install.ps1 THIRD_PARTY_NOTICES.md

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-binaries
          path: "*.zip"

      - name: Generate checksums
        shell: msys2 {0}
        run: |
          sha256sum *.zip > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2
        with:
          tag_name: ${{ inputs.version }}
          name: Windows Build ${{ inputs.version }}
          draft: false
          prerelease: true
          files: |
            *.zip
            checksums.txt
          body: |
            ## Windows Binaries - ${{ inputs.version }}

            Quick Windows-only build (no tests, no checks).

            ### Files:
            - `codebase-memory-mcp-windows-amd64.zip` - Standard binary
            - `codebase-memory-mcp-ui-windows-amd64.zip` - UI variant (if built)
            - `checksums.txt` - SHA256 checksums

            ### Installation:
            ```powershell
            # Extract and run
            unzip codebase-memory-mcp-windows-amd64.zip
            .\install.ps1
            ```

            ---
            **Note:** This is a quick test build. For production use, see [official releases](https://github.com/DeusData/codebase-memory-mcp/releases/latest).
